name: Release

# Cutting a release is `rake release`'s job locally; here it is a tag push.
# No API key is involved: rubygems/release-gem trades the job's OIDC token
# for a short-lived RubyGems key, so nothing long-lived is ever stored.
on:
  push:
    tags: ["v*"]

jobs:
  push:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # rake release pushes the tag
      id-token: write   # mandatory: without it the OIDC exchange cannot happen

    # Must match the environment named in the trusted publisher on rubygems.org.
    environment: release

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - uses: rubygems/release-gem@v1
