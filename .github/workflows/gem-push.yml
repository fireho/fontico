name: Ruby Gem

# One release path: push a v* tag, CI has to go green, then the gem ships.
# No API key is involved — rubygems/release-gem trades this job's OIDC token
# for a short-lived RubyGems key, which is also the only way to push a gem
# whose gemspec sets rubygems_mfa_required.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # required_ruby_version is >= 3.1; test the floor and the head.
        ruby: ["3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v5
      # rubocop pulls in parallel 2.x, which requires Ruby >= 3.3, so the
      # committed lock cannot install on the 3.1/3.2 floor. A gem's lock is a
      # local convenience anyway: resolve fresh per ruby and test what a user
      # of that ruby would actually get.
      - run: rm -f Gemfile.lock
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop --parallel

  push:
    name: Build + Publish
    needs: [test, lint]
    runs-on: ubuntu-latest

    permissions:
      contents: write   # rake release pushes the tag
      id-token: write   # mandatory: without it the OIDC exchange cannot happen

    # Must match the environment named in the trusted publisher on rubygems.org.
    environment: release

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: rubygems/release-gem@v1
