name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # required_ruby_version is >= 3.1; test the floor and the head.
        ruby: ["3.1", "3.2", "3.3", "3.4"]

    steps:
      - uses: actions/checkout@v5
      # rubocop pulls in parallel 2.x, which requires Ruby >= 3.3, so the
      # committed lock cannot install on the 3.1/3.2 floor. A gem's lock is a
      # local convenience anyway: resolve fresh per ruby and test what a user
      # of that ruby would actually get.
      - run: rm -f Gemfile.lock
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # The suite is hermetic: no network, no Node. Font targets shell out to
      # Node, but nothing under test does — that stays a manual/integration
      # concern, so CI needs no toolchain beyond Ruby.
      - run: bundle exec rake test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop --parallel
